{% extends "base.html" %}

{% block title %}数据源管理 - 数据处理与可视化中心{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2><i class="fas fa-database"></i> 数据源管理</h2>
        <p class="text-muted">支持配置和连接常见数据源（如MySQL数据库、CSV/Excel文件、RESTful API接口）</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-4 col-md-5 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-plus-circle"></i> 添加数据源</h5>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs" id="sourceTypeTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="file-tab" data-bs-toggle="tab" data-bs-target="#file" type="button" role="tab">
                            <i class="fas fa-file-upload"></i> 文件上传
                        </button>
                    </li>
                </ul>
                
                <div class="tab-content mt-3" id="sourceTypeTabsContent">
                    <div class="tab-pane fade show active" id="file" role="tabpanel">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">选择文件</label>
                                <input type="file" class="form-control" id="dataFile" name="file" accept=".csv,.xlsx,.xls">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-upload"></i> 上传文件
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-lg-8 col-md-7 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-list"></i> 数据源列表</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>类型</th>
                                <th>状态</th>
                                
                            </tr>
                        </thead>
                        <tbody id="dataSourceList">
                            <tr>
                                <td colspan="4" class="text-center">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">加载中...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 加载数据源列表
    loadDataSourceList();
    
    // 文件上传表单提交
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        uploadFile();
    });
});

// 加载数据源列表
function loadDataSourceList() {
    axios.get('/api/data_sources')
        .then(function(response) {
            const sources = response.data;
            const tbody = document.getElementById('dataSourceList');
            
            if (sources.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">暂无数据源</td></tr>';
                return;
            }
            /*
                                        <button class="btn btn-sm btn-outline-primary" onclick="previewData('${source.name}')">
                                <i class="fas fa-search"></i> 0xffff
                            </button>
                                    <td>

                            <button class="btn btn-sm btn-outline-danger" onclick="deleteDataSource('${source.name}')">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </td>
                         
            */
            let html = '';
            sources.forEach(function(source) {
                html += `
                    <tr>
                        <td>${source.name}</td>
                        <td>${source.type}</td>
                        <td><span class="badge bg-success">已连接</span></td>

                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        })
        .catch(function(error) {
            console.error('加载数据源失败:', error);
            document.getElementById('dataSourceList').innerHTML = '<tr><td colspan="4" class="text-center text-danger">加载失败: ' + error.message + '</td></tr>';
        });
}

// 上传文件
function uploadFile() {
    const fileInput = document.getElementById('dataFile');
    const file = fileInput.files[0];
    
    if (!file) {
        showMessage('请选择一个文件', 'warning');
        return;
    }
    
    const formData = new FormData();
    formData.append('file', file);
    
    axios.post('/api/upload', formData)
        .then(function(response) {
            showMessage('文件上传成功', 'success');
            fileInput.value = '';
            loadDataSourceList();
        })
        .catch(function(error) {
            showMessage('文件上传失败: ' + error.response.data.error, 'danger');
        });
}


// 预览数据
function previewData(filename) {
    window.location.href = `/data_preview/${filename}`;
}

// 删除数据源
function deleteDataSource(filename) {
    if (confirm('确定要删除此数据源吗？')) {
        axios.delete(`/api/data_source/${filename}`)
            .then(function(response) {
                showMessage('数据源删除成功', 'success');
                loadDataSourceList();
            })
            .catch(function(error) {
                showMessage('删除失败: ' + error.response.data.error, 'danger');
            });
    }
}
</script>
{% endblock %}
