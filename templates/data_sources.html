{% extends "base.html" %}

{% block title %}数据源管理 - 数据处理与可视化中心{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h2 class="my-3">数据源管理</h2>
        </div>
    </div>
    
    <div class="row">
        <!-- 上传区域 -->
        <div class="col-xl-4 col-lg-5 col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">上传新数据</h5>
                </div>
                <div class="card-body">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="dataFile" class="form-label">选择CSV文件</label>
                            <input class="form-control" type="file" id="dataFile" name="file" accept=".csv,.txt">
                            <div class="form-text">支持UTF-8、GBK等编码格式的CSV文件</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-upload"></i> 上传文件
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">数据源列表</h5>
                </div>
                <div class="card-body">
                    <div id="dataSourceList">
                        <p class="text-muted text-center my-3">加载中...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 预览区域 -->
        <div class="col-xl-8 col-lg-7 col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">数据预览</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <select class="form-select" id="dataSourceSelect">
                                <option selected>请选择数据源</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button id="previewDataBtn" class="btn btn-primary w-100" disabled>
                                <i class="fas fa-search"></i> 预览数据
                            </button>
                        </div>
                    </div>
                    <div id="dataInfo" class="mb-3"></div>
                    <div id="dataPreview" class="table-responsive">
                        <p class="text-muted text-center my-5">请选择一个数据源以预览数据</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 加载数据源列表
    loadDataSourceList();
    
    // 设置上传表单事件
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        uploadFile();
    });
    
    // 设置数据源选择事件
    document.getElementById('dataSourceSelect').addEventListener('change', function() {
        const filename = this.value;
        document.getElementById('previewDataBtn').disabled = !filename;
    });
    
    // 设置预览按钮事件
    document.getElementById('previewDataBtn').addEventListener('click', function() {
        const filename = document.getElementById('dataSourceSelect').value;
        if (filename) {
            previewData(filename);
        }
    });
});

// 加载数据源列表
function loadDataSourceList() {
    axios.get('/api/data_sources')
        .then(function(response) {
            const sources = response.data;
            const listContainer = document.getElementById('dataSourceList');
            const selectElement = document.getElementById('dataSourceSelect');
            
            if (!sources || sources.length === 0) {
                listContainer.innerHTML = '<p class="text-muted text-center my-3">暂无数据源，请先上传数据</p>';
                selectElement.innerHTML = '<option selected>请选择数据源</option>';
                return;
            }
            
            // 更新数据源列表
            let listHtml = '<div class="list-group">';
            sources.forEach(function(source) {
                listHtml += `
                    <div class="list-group-item list-group-item-action">
                        <div class="d-flex justify-content-between">
                            <div>
                                <i class="fas fa-file-csv text-primary me-2"></i>
                                <strong>${source.name}</strong>
                            </div>
                            <span class="badge bg-primary">${source.type}</span>
                        </div>
                    </div>
                `;
            });
            listHtml += '</div>';
            listContainer.innerHTML = listHtml;
            
            // 更新选择框
            let selectHtml = '<option selected>请选择数据源</option>';
            sources.forEach(function(source) {
                selectHtml += `<option value="${source.name}">${source.name}</option>`;
            });
            selectElement.innerHTML = selectHtml;
        })
        .catch(function(error) {
            console.error('Error loading data sources:', error);
            document.getElementById('dataSourceList').innerHTML = `<p class="text-danger text-center my-3">加载数据源失败: ${error.message}</p>`;
        });
}

// 上传文件
function uploadFile() {
    const fileInput = document.getElementById('dataFile');
    const file = fileInput.files[0];
    
    if (!file) {
        showMessage('请选择一个文件', 'warning');
        return;
    }
    
    // 检查文件类型
    const allowedTypes = ['text/csv', 'application/vnd.ms-excel'];
    if (file.type && !allowedTypes.includes(file.type) && !file.name.endsWith('.csv')) {
        showMessage('请上传CSV格式的文件', 'warning');
        return;
    }
    
    const formData = new FormData();
    formData.append('file', file);
    
    // 显示上传进度
    const uploadBtn = document.querySelector('#uploadForm button[type="submit"]');
    const originalText = uploadBtn.innerHTML;
    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上传中...';
    uploadBtn.disabled = true;
    
    axios.post('/api/upload', formData)
        .then(function(response) {
            showMessage('文件上传成功', 'success');
            fileInput.value = '';
            loadDataSourceList(); // 重新加载数据源列表
        })
        .catch(function(error) {
            console.error('Upload error:', error);
            if (error.response && error.response.data && error.response.data.error) {
                showMessage('文件上传失败: ' + error.response.data.error, 'danger');
            } else {
                showMessage('文件上传失败: ' + (error.message || '未知错误'), 'danger');
            }
        })
        .finally(function() {
            // 恢复按钮状态
            uploadBtn.innerHTML = originalText;
            uploadBtn.disabled = false;
        });
}

// 预览数据
function previewData(filename) {
    const previewContainer = document.getElementById('dataPreview');
    const infoContainer = document.getElementById('dataInfo');
    previewContainer.innerHTML = '<p class="text-center my-5"><i class="fas fa-spinner fa-spin fa-2x"></i><br>数据加载中...</p>';
    infoContainer.innerHTML = '';
    
    axios.get(`/api/data/${filename}/preview`)
        .then(function(response) {
            const data = response.data;
            if (data.error) {
                previewContainer.innerHTML = `<div class="alert alert-danger">
                    <h5><i class="fas fa-exclamation-triangle"></i> 加载失败</h5>
                    <p class="mb-0">错误信息: ${data.error}</p>
                    <small class="text-muted">请检查文件格式是否正确，确保是有效的CSV文件</small>
                </div>`;
                return;
            }
            
            // 验证数据结构
            if (!data || !data.columns || !data.data) {
                previewContainer.innerHTML = `<div class="alert alert-danger">
                    <h5><i class="fas fa-exclamation-circle"></i> 数据格式错误</h5>
                    <p class="mb-0">返回的数据格式不正确，请检查文件内容</p>
                </div>`;
                return;
            }
            
            // 显示数据信息
            const dataInfo = data.info || {};
            infoContainer.innerHTML = `
                <div class="row text-center">
                    <div class="col-md-4">
                        <div class="alert alert-info mb-2">
                            <h6 class="mb-0">${dataInfo.total_rows || 0}</h6>
                            <small>总行数</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="alert alert-success mb-2">
                            <h6 class="mb-0">${dataInfo.total_columns || 0}</h6>
                            <small>总列数</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="alert alert-warning mb-2">
                            <h6 class="mb-0">${(dataInfo.numeric_columns || []).length}</h6>
                            <small>数值列</small>
                        </div>
                    </div>
                </div>
            `;
            
            // 构建表格
            let tableHtml = '<table class="table table-striped table-hover table-sm"><thead class="table-dark"><tr>';
            
            // 表头
            data.columns.forEach(function(column) {
                tableHtml += `<th>${column}</th>`;
            });
            
            tableHtml += '</tr></thead><tbody>';
            
            // 表体
            data.data.forEach(function(row) {
                tableHtml += '<tr>';
                data.columns.forEach(function(column) {
                    const value = row[column];
                    tableHtml += `<td>${value !== undefined && value !== null ? value : '<span class="text-muted">空</span>'}</td>`;
                });
                tableHtml += '</tr>';
            });
            
            tableHtml += '</tbody></table>';
            
            // 如果数据超过10行，添加提示
            if (data.data.length > 10) {
                tableHtml += `<div class="mt-2 text-muted small">
                    <i class="fas fa-info-circle"></i> 共 ${data.data.length} 行数据，仅显示前10行
                </div>`;
            }
            
            previewContainer.innerHTML = tableHtml;
        })
        .catch(function(error) {
            console.error('Preview error:', error);
            previewContainer.innerHTML = `<div class="alert alert-danger">
                <h5><i class="fas fa-exclamation-triangle"></i> 数据预览加载失败</h5>
                <p class="mb-0">错误信息: ${error.message}</p>
                <small class="text-muted">请尝试刷新页面或重新上传文件</small>
            </div>`;
        });
}
</script>
{% endblock %}
