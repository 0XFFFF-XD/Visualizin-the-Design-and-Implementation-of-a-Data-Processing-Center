{% extends "base.html" %}

{% block title %}任务调度 - 数据处理与可视化中心{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2><i class="fas fa-calendar-alt"></i> 任务调度</h2>
        <p class="text-muted">实现简单数据处理任务的定时调度与执行状态监控</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-4 col-md-5 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-plus-circle"></i> 创建任务</h5>
            </div>
            <div class="card-body">
                <form id="taskForm">
                    <div class="mb-3">
                        <label class="form-label">任务名称</label>
                        <input type="text" class="form-control" id="taskName" placeholder="请输入任务名称">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">选择数据文件</label>
                        <select class="form-select" id="taskDataFile">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">调度周期</label>
                        <select class="form-select" id="taskSchedule">
                            <option value="once">一次性任务</option>
                            <option value="hourly">每小时</option>
                            <option value="daily">每天</option>
                            <option value="weekly">每周</option>
                            <option value="monthly">每月</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">执行时间</label>
                        <input type="time" class="form-control" id="taskScheduleTime">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">描述</label>
                        <textarea class="form-control" id="taskDescription" rows="3" placeholder="请输入任务描述"></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-plus"></i> 创建任务
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-lg-8 col-md-7 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-tasks"></i> 任务列表</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>任务名称</th>
                                <th>数据源</th>
                                <th>调度周期</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="taskList">
                            <tr>
                                <td colspan="5" class="text-center">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">加载中...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-file-alt"></i> 任务日志</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>任务名称</th>
                                <th>执行时间</th>
                                <th>状态</th>
                                <th>耗时</th>
                                <th>消息</th>
                            </tr>
                        </thead>
                        <tbody id="logList">
                            <tr>
                                <td colspan="5" class="text-center">暂无日志记录</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// DOM加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    // 加载数据
    loadDataSourceList();
    loadTasks();
    loadTaskLogs();
    
    // 绑定事件
    document.getElementById('taskForm').addEventListener('submit', createTask);
});

// 加载数据源列表
function loadDataSourceList() {
    const selectElement = document.getElementById('taskDataFile');
    selectElement.innerHTML = '<option value="">加载中...</option>';
    
    axios.get('/api/data_sources')
        .then(function(response) {
            const sources = response.data;
            
            if (!sources || sources.length === 0) {
                selectElement.innerHTML = '<option value="">暂无数据源</option>';
                return;
            }
            
            let selectHtml = '<option value="">请选择数据源</option>';
            sources.forEach(function(source) {
                selectHtml += `<option value="${source.name}">${source.name}</option>`;
            });
            selectElement.innerHTML = selectHtml;
        })
        .catch(function(error) {
            console.error('Error loading data sources:', error);
            selectElement.innerHTML = '<option value="">加载失败</option>';
            showMessage('加载数据源失败: ' + error.message, 'danger');
        });
}

// 创建任务
function createTask(e) {
    e.preventDefault();
    
    const name = document.getElementById('taskName').value;
    const dataFile = document.getElementById('taskDataFile').value;
    const schedule = document.getElementById('taskSchedule').value;
    const scheduleTime = document.getElementById('taskScheduleTime').value;
    const description = document.getElementById('taskDescription').value;
    
    if (!name || !dataFile || !schedule) {
        showMessage('请填写所有必填项', 'warning');
        return;
    }
    
    const taskData = {
        name: name,
        dataSource: dataFile,
        schedule: schedule,
        scheduleTime: scheduleTime,
        description: description,
        operations: []
    };
    
    axios.post('/api/tasks', taskData)
        .then(function(response) {
            showMessage('任务创建成功', 'success');
            document.getElementById('taskForm').reset();
            loadTasks();
        })
        .catch(function(error) {
            showMessage('任务创建失败: ' + error.message, 'danger');
        });
}

// 加载任务列表
function loadTasks() {
    axios.get('/api/tasks')
        .then(function(response) {
            const tasks = response.data;
            const tbody = document.getElementById('taskList');
            
            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">暂无任务</td></tr>';
                return;
            }
            
            let html = '';
            tasks.forEach(function(task) {
                html += `
                    <tr>
                        <td>${task.name}</td>
                        <td>${task.dataSource}</td>
                        <td>${getScheduleText(task.schedule)}</td>
                        <td>
                            <span class="badge ${getStatusBadgeClass(task.status)}">${getStatusText(task.status)}</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="runTask(${task.id})">
                                <i class="fas fa-play"></i> 执行
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id})">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        })
        .catch(function(error) {
            console.error('加载任务失败:', error);
            document.getElementById('taskList').innerHTML = '<tr><td colspan="5" class="text-center text-danger">加载失败: ' + error.message + '</td></tr>';
        });
}

// 获取调度周期文本
function getScheduleText(schedule) {
    const schedules = {
        'once': '一次性',
        'hourly': '每小时',
        'daily': '每天',
        'weekly': '每周',
        'monthly': '每月'
    };
    return schedules[schedule] || schedule;
}

// 获取状态文本
function getStatusText(status) {
    const statuses = {
        'scheduled': '已调度',
        'running': '运行中',
        'completed': '已完成',
        'failed': '失败'
    };
    return statuses[status] || status;
}

// 获取状态徽章类
function getStatusBadgeClass(status) {
    const classes = {
        'scheduled': 'bg-info',
        'running': 'bg-warning',
        'completed': 'bg-success',
        'failed': 'bg-danger'
    };
    return classes[status] || 'bg-secondary';
}

// 运行任务
function runTask(taskId) {
    axios.post(`/api/tasks/${taskId}/run`)
        .then(function(response) {
            showMessage('任务开始执行', 'success');
            loadTasks();
        })
        .catch(function(error) {
            showMessage('任务执行失败: ' + error.message, 'danger');
        });
}

// 删除任务
function deleteTask(taskId) {
    if (confirm('确定要删除此任务吗？')) {
        axios.delete(`/api/tasks/${taskId}`)
            .then(function(response) {
                showMessage('任务已删除', 'success');
                loadTasks();
            })
            .catch(function(error) {
                showMessage('任务删除失败: ' + error.message, 'danger');
            });
    }
}

// 加载任务日志
function loadTaskLogs() {
    axios.get('/api/task_logs')
        .then(function(response) {
            const logs = response.data;
            const tbody = document.getElementById('logList');
            
            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">暂无日志记录</td></tr>';
                return;
            }
            
            let html = '';
            logs.forEach(function(log) {
                html += `
                    <tr>
                        <td>${log.taskName}</td>
                        <td>${log.executeTime}</td>
                        <td>
                            <span class="badge ${getLogStatusBadgeClass(log.status)}">${getLogStatusText(log.status)}</span>
                        </td>
                        <td>${log.duration}</td>
                        <td>${log.message}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        })
        .catch(function(error) {
            console.error('加载日志失败:', error);
        });
}

// 获取日志状态文本
function getLogStatusText(status) {
    const statuses = {
        'success': '成功',
        'failed': '失败'
    };
    return statuses[status] || status;
}

// 获取日志状态徽章类
function getLogStatusBadgeClass(status) {
    const classes = {
        'success': 'bg-success',
        'failed': 'bg-danger'
    };
    return classes[status] || 'bg-secondary';
}
</script>
{% endblock %}
