{% extends "base.html" %}

{% block title %}任务调度 - 数据处理与可视化中心{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h2 class="my-3">任务调度与监控</h2>
        </div>
    </div>
    
    <div class="row">
        <div class="col-xl-4 col-lg-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">创建任务</h5>
                </div>
                <div class="card-body">
                    <form id="taskForm">
                        <div class="mb-3">
                            <label class="form-label">任务名称</label>
                            <input type="text" class="form-control" id="taskName" placeholder="请输入任务名称">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">数据源</label>
                            <select class="form-select" id="taskDataSource">
                                <option value="">请选择数据源</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">处理操作</label>
                            <div class="form-control" style="height: auto;">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="opFilter" value="filter">
                                    <label class="form-check-label" for="opFilter">过滤</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="opSort" value="sort">
                                    <label class="form-check-label" for="opSort">排序</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="opGroup" value="group">
                                    <label class="form-check-label" for="opGroup">分组聚合</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">调度周期</label>
                            <select class="form-select" id="taskSchedule">
                                <option value="once">一次性执行</option>
                                <option value="hourly">每小时</option>
                                <option value="daily">每天</option>
                                <option value="weekly">每周</option>
                                <option value="monthly">每月</option>
                            </select>
                        </div>
                        
                        <div class="mb-3" id="scheduleTimeContainer" style="display: none;">
                            <label class="form-label">执行时间</label>
                            <input type="time" class="form-control" id="scheduleTime">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">任务描述</label>
                            <textarea class="form-control" id="taskDescription" rows="3" placeholder="请输入任务描述"></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-plus"></i> 创建任务
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">系统状态</h5>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-6">
                            <div class="alert alert-primary mb-3">
                                <h5 id="totalTasks">0</h5>
                                <small>总任务数</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="alert alert-success mb-3">
                                <h5 id="runningTasks">0</h5>
                                <small>运行中</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="alert alert-warning mb-3">
                                <h5 id="scheduledTasks">0</h5>
                                <small>待执行</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="alert alert-danger mb-3">
                                <h5 id="failedTasks">0</h5>
                                <small>失败</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-xl-8 col-lg-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">任务列表</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>任务名称</th>
                                    <th>数据源</th>
                                    <th>调度周期</th>
                                    <th>状态</th>
                                    <th>下次执行</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="taskList">
                                <tr>
                                    <td colspan="6" class="text-center text-muted">暂无任务数据</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">执行日志</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>任务名称</th>
                                    <th>执行时间</th>
                                    <th>状态</th>
                                    <th>耗时</th>
                                    <th>详情</th>
                                </tr>
                            </thead>
                            <tbody id="taskLogs">
                                <tr>
                                    <td colspan="5" class="text-center text-muted">暂无执行日志</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 任务数据
let tasks = [];
let taskLogs = [];

// DOM加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    initializeScheduling();
    loadDataSourceList();
    loadTasks();
    loadTaskLogs();
    
    // 绑定表单提交事件
    document.getElementById('taskForm').addEventListener('submit', createTask);
    
    // 调度周期变化事件
    document.getElementById('taskSchedule').addEventListener('change', function() {
        const container = document.getElementById('scheduleTimeContainer');
        container.style.display = this.value !== 'once' ? 'block' : 'none';
    });
});

// 初始化任务调度页面
function initializeScheduling() {
    // 模拟系统状态数据
    updateSystemStatus({
        total: 12,
        running: 3,
        scheduled: 5,
        failed: 1
    });
}

// 更新系统状态
function updateSystemStatus(status) {
    document.getElementById('totalTasks').textContent = status.total;
    document.getElementById('runningTasks').textContent = status.running;
    document.getElementById('scheduledTasks').textContent = status.scheduled;
    document.getElementById('failedTasks').textContent = status.failed;
}

// 加载数据源列表
function loadDataSourceList() {
    axios.get('/api/data_sources')
        .then(function(response) {
            const sources = response.data;
            const selectElement = document.getElementById('taskDataSource');
            
            if (!sources || sources.length === 0) {
                selectElement.innerHTML = '<option value="">暂无数据源</option>';
                return;
            }
            
            let selectHtml = '<option value="">请选择数据源</option>';
            sources.forEach(function(source) {
                selectHtml += `<option value="${source.name}">${source.name}</option>`;
            });
            selectElement.innerHTML = selectHtml;
        })
        .catch(function(error) {
            console.error('Error loading data sources:', error);
            showMessage('加载数据源失败: ' + error.message, 'danger');
        });
}

// 加载任务列表
function loadTasks() {
    // 模拟从后端加载任务数据
    tasks = [
        {
            id: 1,
            name: '销售数据处理',
            dataSource: 'sales_data.csv',
            schedule: 'daily',
            status: 'running',
            nextRun: '2025-10-25 02:00:00'
        },
        {
            id: 2,
            name: '用户行为分析',
            dataSource: 'user_behavior.csv',
            schedule: 'hourly',
            status: 'scheduled',
            nextRun: '2025-10-24 15:00:00'
        },
        {
            id: 3,
            name: '财务报表生成',
            dataSource: 'finance_data.csv',
            schedule: 'weekly',
            status: 'failed',
            nextRun: '2025-10-30 09:00:00'
        }
    ];
    
    renderTaskList();
}

// 渲染任务列表
function renderTaskList() {
    const tbody = document.getElementById('taskList');
    
    if (tasks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无任务数据</td></tr>';
        return;
    }
    
    let html = '';
    tasks.forEach(function(task) {
        let statusBadge = '';
        switch(task.status) {
            case 'running':
                statusBadge = '<span class="badge bg-success">运行中</span>';
                break;
            case 'scheduled':
                statusBadge = '<span class="badge bg-warning text-dark">待执行</span>';
                break;
            case 'failed':
                statusBadge = '<span class="badge bg-danger">失败</span>';
                break;
            default:
                statusBadge = '<span class="badge bg-secondary">未知</span>';
        }
        
        html += `
            <tr>
                <td>${task.name}</td>
                <td>${task.dataSource}</td>
                <td>${getScheduleText(task.schedule)}</td>
                <td>${statusBadge}</td>
                <td>${task.nextRun}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="runTask(${task.id})">
                        <i class="fas fa-play"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
}

// 获取调度周期文本
function getScheduleText(schedule) {
    const map = {
        'once': '一次性',
        'hourly': '每小时',
        'daily': '每天',
        'weekly': '每周',
        'monthly': '每月'
    };
    return map[schedule] || schedule;
}

// 加载任务日志
function loadTaskLogs() {
    // 模拟从后端加载日志数据
    taskLogs = [
        {
            id: 1,
            taskName: '销售数据处理',
            executeTime: '2025-10-24 14:00:00',
            status: 'success',
            duration: '2.5s'
        },
        {
            id: 2,
            taskName: '用户行为分析',
            executeTime: '2025-10-24 13:00:00',
            status: 'success',
            duration: '1.8s'
        },
        {
            id: 3,
            taskName: '财务报表生成',
            executeTime: '2025-10-24 12:00:00',
            status: 'failed',
            duration: '0.5s'
        }
    ];
    
    renderTaskLogs();
}

// 渲染任务日志
function renderTaskLogs() {
    const tbody = document.getElementById('taskLogs');
    
    if (taskLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">暂无执行日志</td></tr>';
        return;
    }
    
    let html = '';
    taskLogs.forEach(function(log) {
        let statusBadge = '';
        switch(log.status) {
            case 'success':
                statusBadge = '<span class="badge bg-success">成功</span>';
                break;
            case 'failed':
                statusBadge = '<span class="badge bg-danger">失败</span>';
                break;
            default:
                statusBadge = '<span class="badge bg-secondary">未知</span>';
        }
        
        html += `
            <tr>
                <td>${log.taskName}</td>
                <td>${log.executeTime}</td>
                <td>${statusBadge}</td>
                <td>${log.duration}</td>
                <td>
                    <button class="btn btn-sm btn-outline-info" onclick="viewLogDetails(${log.id})">
                        <i class="fas fa-info-circle"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
}

// 创建任务
function createTask(e) {
    e.preventDefault();
    
    const name = document.getElementById('taskName').value;
    const dataSource = document.getElementById('taskDataSource').value;
    const schedule = document.getElementById('taskSchedule').value;
    
    if (!name || !dataSource) {
        showMessage('请填写任务名称和选择数据源', 'warning');
        return;
    }
    
    // 模拟创建任务
    const newTask = {
        id: tasks.length + 1,
        name: name,
        dataSource: dataSource,
        schedule: schedule,
        status: 'scheduled',
        nextRun: '2025-10-24 16:00:00'
    };
    
    tasks.push(newTask);
    renderTaskList();
    
    // 重置表单
    document.getElementById('taskForm').reset();
    document.getElementById('scheduleTimeContainer').style.display = 'none';
    
    showMessage('任务创建成功', 'success');
}

// 执行任务
function runTask(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (task) {
        showMessage(`正在执行任务: ${task.name}`, 'info');
        
        // 模拟任务执行
        setTimeout(function() {
            // 更新任务状态
            task.status = 'running';
            renderTaskList();
            
            // 添加日志
            const newLog = {
                id: taskLogs.length + 1,
                taskName: task.name,
                executeTime: new Date().toLocaleString('zh-CN'),
                status: 'success',
                duration: (Math.random() * 3).toFixed(1) + 's'
            };
            
            taskLogs.unshift(newLog);
            renderTaskLogs();
            
            showMessage(`任务执行完成: ${task.name}`, 'success');
        }, 2000);
    }
}

// 删除任务
function deleteTask(taskId) {
    if (confirm('确定要删除此任务吗？')) {
        tasks = tasks.filter(t => t.id !== taskId);
        renderTaskList();
        showMessage('任务已删除', 'success');
    }
}

// 查看日志详情
function viewLogDetails(logId) {
    const log = taskLogs.find(l => l.id === logId);
    if (log) {
        showMessage(`任务: ${log.taskName}\n执行时间: ${log.executeTime}\n状态: ${log.status}\n耗时: ${log.duration}`, 'info');
    }
}
</script>
{% endblock %}
