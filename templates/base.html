<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}数据处理与可视化中心{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 1rem;
        }
        .card-header {
            font-weight: 500;
        }
        footer {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            margin-top: 40px;
        }
        .alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            width: 300px;
        }
        .table th {
            font-weight: 600;
        }
        .btn i {
            margin-right: 5px;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-database"></i> 数据处理与可视化中心
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/data_sources"><i class="fas fa-file-upload"></i> 数据源</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/data_processing"><i class="fas fa-cogs"></i> 数据处理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/visualization"><i class="fas fa-chart-bar"></i> 数据可视化</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="alert-container" id="alertContainer"></div>

    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5><i class="fas fa-info-circle"></i> 关于系统</h5>
                    <p class="small">数据处理与可视化中心是一个集成化的数据分析平台，支持多种数据源接入、数据处理和可视化展示。</p>
                </div>
                <div class="col-md-6">
                    <h5><i class="fas fa-link"></i> 快速链接</h5>
                    <ul class="list-unstyled">
                        <li><a href="/" class="text-white"><i class="fas fa-home"></i> 首页</a></li>
                        <li><a href="/data_sources" class="text-white"><i class="fas fa-file-upload"></i> 数据源管理</a></li>
                        <li><a href="/data_processing" class="text-white"><i class="fas fa-cogs"></i> 数据处理</a></li>
                        <li><a href="/visualization" class="text-white"><i class="fas fa-chart-bar"></i> 数据可视化</a></li>
                        <li><a href="/dashboard" class="text-white"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                    </ul>
                </div>
            </div>
            <hr class="bg-light">
            <div class="text-center">
                <small>&copy; 2025 数据处理与可视化中心. 保留所有权利.</small>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // 全局消息显示函数
        function showMessage(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();
            
            const alertHtml = `
                <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            
            alertContainer.innerHTML += alertHtml;
            
            // 5秒后自动关闭
            setTimeout(() => {
                const alert = document.getElementById(alertId);
                if (alert) {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                }
            }, 5000);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
