{% extends "base.html" %}

{% block title %}仪表盘 - 数据处理与可视化中心{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h2 class="my-3">数据仪表盘</h2>
        </div>
    </div>
    
    <div class="row mb-3">
        <div class="col-md-6">
            <div class="btn-group" role="group">
                <button id="addChartBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> 添加图表
                </button>
                <button id="saveDashboardBtn" class="btn btn-success">
                    <i class="fas fa-save"></i> 保存仪表盘
                </button>
                <button id="clearDashboardBtn" class="btn btn-danger">
                    <i class="fas fa-trash"></i> 清空
                </button>
            </div>
        </div>
        <div class="col-md-6 text-end">
            <div class="btn-group" role="group">
                <button id="editModeBtn" class="btn btn-outline-secondary active">
                    <i class="fas fa-edit"></i> 编辑模式
                </button>
                <button id="viewModeBtn" class="btn btn-outline-secondary">
                    <i class="fas fa-eye"></i> 查看模式
                </button>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-12">
            <div id="dashboardContainer" class="dashboard-grid">
                <!-- 仪表盘内容将通过JavaScript动态添加 -->
                <div class="dashboard-placeholder">
                    <p class="text-muted text-center my-5">
                        <i class="fas fa-plus-circle fa-3x mb-3"></i><br>
                        点击"添加图表"按钮开始创建您的仪表盘
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 图表配置模态框 -->
<div class="modal fade" id="chartConfigModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">图表配置</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="chartConfigForm">
                    <input type="hidden" id="chartId">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">数据源</label>
                                <select class="form-select" id="chartDataSource">
                                    <option value="">请选择数据源</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">图表类型</label>
                                <select class="form-select" id="chartType">
                                    <option value="bar">柱状图</option>
                                    <option value="line">折线图</option>
                                    <option value="pie">饼图</option>
                                    <option value="doughnut">环形图</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">标签字段 (X轴)</label>
                                <select class="form-select" id="chartXField">
                                    <option value="">请选择字段</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">数值字段 (Y轴)</label>
                                <select class="form-select" id="chartYField">
                                    <option value="">请选择字段</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">图表标题</label>
                        <input type="text" class="form-control" id="chartTitle" placeholder="请输入图表标题">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="chartShowLegend" checked>
                                <label class="form-check-label" for="chartShowLegend">
                                    显示图例
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="chartAnimate" checked>
                                <label class="form-check-label" for="chartAnimate">
                                    启用动画
                                </label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveChartConfigBtn">保存配置</button>
            </div>
        </div>
    </div>
</div>

<!-- 图表选择模态框 -->
<div class="modal fade" id="addChartModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加图表</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <button class="btn btn-outline-primary chart-template-btn w-100" data-size="small">
                            <i class="fas fa-square"></i><br>
                            小图表
                        </button>
                    </div>
                    <div class="col-md-6 mb-3">
                        <button class="btn btn-outline-success chart-template-btn w-100" data-size="medium">
                            <i class="fas fa-th-large"></i><br>
                            中图表
                        </button>
                    </div>
                    <div class="col-md-6 mb-3">
                        <button class="btn btn-outline-warning chart-template-btn w-100" data-size="large">
                            <i class="fas fa-th"></i><br>
                            大图表
                        </button>
                    </div>
                    <div class="col-md-6 mb-3">
                        <button class="btn btn-outline-info chart-template-btn w-100" data-size="wide">
                            <i class="fas fa-arrows-alt-h"></i><br>
                            宽图表
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
// 仪表盘状态管理
let dashboard = {
    charts: [],
    editMode: true,
    nextId: 1
};

// DOM加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    initializeDashboard();
    loadDataSourceList();
    
    // 绑定事件
    document.getElementById('addChartBtn').addEventListener('click', openAddChartModal);
    document.getElementById('saveDashboardBtn').addEventListener('click', saveDashboard);
    document.getElementById('clearDashboardBtn').addEventListener('click', clearDashboard);
    document.getElementById('editModeBtn').addEventListener('click', () => setEditMode(true));
    document.getElementById('viewModeBtn').addEventListener('click', () => setEditMode(false));
    document.getElementById('saveChartConfigBtn').addEventListener('click', saveChartConfiguration);
    
    // 图表模板按钮事件
    document.querySelectorAll('.chart-template-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const size = this.getAttribute('data-size');
            addChartToDashboard(size);
            bootstrap.Modal.getInstance(document.getElementById('addChartModal')).hide();
        });
    });
});

// 初始化仪表盘
function initializeDashboard() {
    const container = document.getElementById('dashboardContainer');
    new Sortable(container, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        filter: '.dashboard-placeholder',
        on End: function(evt) {
            // 拖拽结束后的处理
            updateChartPositions();
        }
    });
}

// 设置编辑模式
function setEditMode(enabled) {
    dashboard.editMode = enabled;
    
    // 更新按钮状态
    document.getElementById('editModeBtn').classList.toggle('active', enabled);
    document.getElementById('viewModeBtn').classList.toggle('active', !enabled);
    
    // 更新图表操作按钮显示状态
    document.querySelectorAll('.chart-actions').forEach(actions => {
        actions.style.display = enabled ? 'block' : 'none';
    });
    
    // 更新容器类名
    document.getElementById('dashboardContainer').className = 
        enabled ? 'dashboard-grid' : 'dashboard-grid view-mode';
}

// 打开添加图表模态框
function openAddChartModal() {
    const modal = new bootstrap.Modal(document.getElementById('addChartModal'));
    modal.show();
}

// 添加图表到仪表盘
function addChartToDashboard(size) {
    const container = document.getElementById('dashboardContainer');
    
    // 移除占位符
    const placeholder = container.querySelector('.dashboard-placeholder');
    if (placeholder) {
        placeholder.remove();
    }
    
    // 创建图表容器
    const chartId = 'chart-' + dashboard.nextId++;
    const chartElement = document.createElement('div');
    chartElement.className = `dashboard-item dashboard-item-${size}`;
    chartElement.id = chartId;
    chartElement.innerHTML = `
        <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="chart-title">未配置图表</span>
                <div class="chart-actions">
                    <button class="btn btn-sm btn-outline-primary configure-chart" data-chart-id="${chartId}">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger delete-chart" data-chart-id="${chartId}">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="chart-container" style="position: relative; height: 100%;">
                    <div class="chart-placeholder d-flex align-items-center justify-content-center h-100">
                        <div class="text-center">
                            <i class="fas fa-chart-bar fa-2x text-muted mb-2"></i>
                            <p class="text-muted">点击齿轮图标配置图表</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    container.appendChild(chartElement);
    
    // 绑定图表操作事件
    chartElement.querySelector('.configure-chart').addEventListener('click', function() {
        openChartConfiguration(chartId);
    });
    
    chartElement.querySelector('.delete-chart').addEventListener('click', function() {
        deleteChart(chartId);
    });
    
    // 添加到仪表盘数据中
    dashboard.charts.push({
        id: chartId,
        size: size,
        config: null
    });
    
    // 如果是查看模式，隐藏操作按钮
    if (!dashboard.editMode) {
        chartElement.querySelector('.chart-actions').style.display = 'none';
    }
}

// 打开图表配置
function openChartConfiguration(chartId) {
    const chart = dashboard.charts.find(c => c.id === chartId);
    if (!chart) return;
    
    // 填充表单数据
    document.getElementById('chartId').value = chartId;
    
    // 如果已有配置，填充到表单
    if (chart.config) {
        document.getElementById('chartDataSource').value = chart.config.dataSource || '';
        document.getElementById('chartType').value = chart.config.type || 'bar';
        document.getElementById('chartXField').value = chart.config.xField || '';
        document.getElementById('chartYField').value = chart.config.yField || '';
        document.getElementById('chartTitle').value = chart.config.title || '';
        document.getElementById('chartShowLegend').checked = chart.config.showLegend !== false;
        document.getElementById('chartAnimate').checked = chart.config.animate !== false;
        
        // 更新字段选项
        if (chart.config.dataSource) {
            updateFieldOptions(chart.config.dataSource);
        }
    } else {
        // 清空表单
        document.getElementById('chartConfigForm').reset();
        document.getElementById('chartXField').innerHTML = '<option value="">请选择字段</option>';
        document.getElementById('chartYField').innerHTML = '<option value="">请选择字段</option>';
    }
    
    // 显示模态框
    const modal = new bootstrap.Modal(document.getElementById('chartConfigModal'));
    modal.show();
}

// 保存图表配置
function saveChartConfiguration() {
    const chartId = document.getElementById('chartId').value;
    const chart = dashboard.charts.find(c => c.id === chartId);
    if (!chart) return;
    
    // 获取表单数据
    const config = {
        dataSource: document.getElementById('chartDataSource').value,
        type: document.getElementById('chartType').value,
        xField: document.getElementById('chartXField').value,
        yField: document.getElementById('chartYField').value,
        title: document.getElementById('chartTitle').value,
        showLegend: document.getElementById('chartShowLegend').checked,
        animate: document.getElementById('chartAnimate').checked
    };
    
    // 验证必填项
    if (!config.dataSource || !config.xField || !config.yField) {
        showMessage('请填写所有必填项', 'warning');
        return;
    }
    
    // 保存配置
    chart.config = config;
    
    // 更新图表标题
    const chartElement = document.getElementById(chartId);
    const titleElement = chartElement.querySelector('.chart-title');
    titleElement.textContent = config.title || '未命名图表';
    
    // 生成图表
    generateChart(chartId, config);
    
    // 关闭模态框
    bootstrap.Modal.getInstance(document.getElementById('chartConfigModal')).hide();
    
    showMessage('图表配置已保存', 'success');
}

// 生成图表
function generateChart(chartId, config) {
    // 这里应该调用后端API获取数据并生成图表
    // 为简化演示，我们使用模拟数据
    
    const chartElement = document.getElementById(chartId);
    const container = chartElement.querySelector('.chart-container');
    
    // 移除占位符
    const placeholder = container.querySelector('.chart-placeholder');
    if (placeholder) {
        placeholder.remove();
    }
    
    // 创建canvas元素
    let canvas = container.querySelector('canvas');
    if (!canvas) {
        canvas = document.createElement('canvas');
        container.appendChild(canvas);
    }
    
    // 清除之前的图表实例
    if (chartElement.chartInstance) {
        chartElement.chartInstance.destroy();
    }
    
    // 获取图表上下文
    const ctx = canvas.getContext('2d');
    
    // 模拟数据
    const labels = ['一月', '二月', '三月', '四月', '五月', '六月'];
    const data = [12, 19, 3, 5, 2, 3];
    
    // 创建图表
    const chartConfig = {
        type: config.type,
        data: {
            labels: labels,
            datasets: [{
                label: config.yField,
                data: data,
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: !!config.title,
                    text: config.title
                },
                legend: {
                    display: config.showLegend
                }
            }
        }
    };
    
    // 根据图表类型设置特定配置
    switch(config.type) {
        case 'bar':
            chartConfig.data.datasets[0].backgroundColor = 'rgba(54, 162, 235, 0.7)';
            chartConfig.data.datasets[0].borderColor = 'rgba(54, 162, 235, 1)';
            chartConfig.options.scales = {
                y: {
                    beginAtZero: true
                }
            };
            break;
            
        case 'line':
            chartConfig.data.datasets[0].fill = false;
            chartConfig.data.datasets[0].borderColor = 'rgb(75, 192, 192)';
            chartConfig.data.datasets[0].backgroundColor = 'rgba(75, 192, 192, 0.2)';
            chartConfig.data.datasets[0].tension = 0.2;
            chartConfig.options.scales = {
                y: {
                    beginAtZero: true
                }
            };
            break;
            
        case 'pie':
        case 'doughnut':
            chartConfig.data.datasets[0].backgroundColor = [
                'rgba(255, 99, 132, 0.8)',
                'rgba(54, 162, 235, 0.8)',
                'rgba(255, 205, 86, 0.8)',
                'rgba(75, 192, 192, 0.8)',
                'rgba(153, 102, 255, 0.8)',
                'rgba(255, 159, 64, 0.8)'
            ];
            chartConfig.data.datasets[0].borderColor = '#fff';
            chartConfig.data.datasets[0].borderWidth = 2;
            break;
    }
    
    // 创建图表实例
    chartElement.chartInstance = new Chart(ctx, chartConfig);
}

// 删除图表
function deleteChart(chartId) {
    if (!dashboard.editMode) {
        showMessage('请先切换到编辑模式', 'warning');
        return;
    }
    
    // 从DOM中移除
    const chartElement = document.getElementById(chartId);
    if (chartElement) {
        // 销毁图表实例
        if (chartElement.chartInstance) {
            chartElement.chartInstance.destroy();
        }
        chartElement.remove();
    }
    
    // 从数据中移除
    dashboard.charts = dashboard.charts.filter(c => c.id !== chartId);
    
    // 如果没有图表了，显示占位符
    if (dashboard.charts.length === 0) {
        const container = document.getElementById('dashboardContainer');
        container.innerHTML = `
            <div class="dashboard-placeholder">
                <p class="text-muted text-center my-5">
                    <i class="fas fa-plus-circle fa-3x mb-3"></i><br>
                    点击"添加图表"按钮开始创建您的仪表盘
                </p>
            </div>
        `;
    }
    
    showMessage('图表已删除', 'success');
}

// 更新图表位置
function updateChartPositions() {
    // 实际项目中这里会更新图表的位置信息
    console.log('图表位置已更新');
}

// 加载数据源列表
function loadDataSourceList() {
    axios.get('/api/data_sources')
        .then(function(response) {
            const sources = response.data;
            const selectElement = document.getElementById('chartDataSource');
            
            if (!sources || sources.length === 0) {
                selectElement.innerHTML = '<option value="">暂无数据源</option>';
                return;
            }
            
            let selectHtml = '<option value="">请选择数据源</option>';
            sources.forEach(function(source) {
                selectHtml += `<option value="${source.name}">${source.name}</option>`;
            });
            selectElement.innerHTML = selectHtml;
            
            // 绑定数据源选择事件
            selectElement.addEventListener('change', function() {
                const filename = this.value;
                if (filename) {
                    updateFieldOptions(filename);
                } else {
                    document.getElementById('chartXField').innerHTML = '<option value="">请选择字段</option>';
                    document.getElementById('chartYField').innerHTML = '<option value="">请选择字段</option>';
                }
            });
        })
        .catch(function(error) {
            console.error('Error loading data sources:', error);
            showMessage('加载数据源失败: ' + error.message, 'danger');
        });
}

// 更新字段选项
function updateFieldOptions(filename) {
    axios.get(`/api/data/${filename}/preview`)
        .then(function(response) {
            const data = response.data;
            if (data && data.columns) {
                // 更新X轴字段选项
                let xOptionsHtml = '<option value="">请选择字段</option>';
                data.columns.forEach(function(column) {
                    xOptionsHtml += `<option value="${column}">${column}</option>`;
                });
                document.getElementById('chartXField').innerHTML = xOptionsHtml;
                
                // 更新Y轴字段选项（仅数值型字段）
                let yOptionsHtml = '<option value="">请选择字段</option>';
                const numericColumns = data.info?.numeric_columns || [];
                if (numericColumns.length > 0) {
                    numericColumns.forEach(function(column) {
                        yOptionsHtml += `<option value="${column}">${column}</option>`;
                    });
                } else {
                    // 如果没有识别出数值型字段，则显示所有字段
                    data.columns.forEach(function(column) {
                        yOptionsHtml += `<option value="${column}">${column}</option>`;
                    });
                }
                document.getElementById('chartYField').innerHTML = yOptionsHtml;
            }
        })
        .catch(function(error) {
            console.error('Error loading field options:', error);
            showMessage('加载字段信息失败: ' + error.message, 'danger');
        });
}

// 保存仪表盘
function saveDashboard() {
    // 实际项目中这里会将仪表盘配置保存到后端
    console.log('保存仪表盘:', dashboard);
    showMessage('仪表盘已保存', 'success');
}

// 清空仪表盘
function clearDashboard() {
    if (!dashboard.editMode) {
        showMessage('请先切换到编辑模式', 'warning');
        return;
    }
    
    if (confirm('确定要清空整个仪表盘吗？此操作不可撤销。')) {
        // 销毁所有图表实例
        dashboard.charts.forEach(chart => {
            const chartElement = document.getElementById(chart.id);
            if (chartElement && chartElement.chartInstance) {
                chartElement.chartInstance.destroy();
            }
        });
        
        // 清空数据
        dashboard.charts = [];
        
        // 更新界面
        const container = document.getElementById('dashboardContainer');
        container.innerHTML = `
            <div class="dashboard-placeholder">
                <p class="text-muted text-center my-5">
                    <i class="fas fa-plus-circle fa-3x mb-3"></i><br>
                    点击"添加图表"按钮开始创建您的仪表盘
                </p>
            </div>
        `;
        
        showMessage('仪表盘已清空', 'success');
    }
}
</script>

<style>
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
    min-height: 500px;
}

.dashboard-grid.view-mode {
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
}

.dashboard-item {
    position: relative;
}

.dashboard-item-small {
    grid-column: span 1;
}

.dashboard-item-medium {
    grid-column: span 2;
}

.dashboard-item-large {
    grid-column: span 3;
}

.dashboard-item-wide {
    grid-column: span 4;
}

.chart-actions {
    display: block;
}

.dashboard-grid.view-mode .chart-actions {
    display: none;
}

.sortable-ghost {
    opacity: 0.5;
    background: #e9ecef;
}

.chart-container {
    min-height: 300px;
}

@media (max-width: 768px) {
    .dashboard-grid {
        grid-template-columns: 1fr;
    }
    
    .dashboard-item-medium,
    .dashboard-item-large,
    .dashboard-item-wide {
        grid-column: span 1;
    }
}
</style>
{% endblock %}
