{% extends "base.html" %}

{% block title %}数据处理 - 数据处理与可视化中心{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2><i class="fas fa-cogs"></i> 数据处理</h2>
        <p class="text-muted">利用Pandas等工具实现可配置的数据清洗、格式转换、字段计算等功能</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-3 col-md-4 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-database"></i> 数据源选择</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">选择数据文件</label>
                    <select class="form-select" id="sourceDataSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <button id="loadSourceBtn" class="btn btn-primary w-100" disabled>
                    <i class="fas fa-download"></i> 加载数据
                </button>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-magic"></i> 处理操作</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" onclick="addFilterOperation()">
                        <i class="fas fa-filter"></i> 添加过滤
                    </button>
                    <button class="btn btn-outline-success" onclick="addSortOperation()">
                        <i class="fas fa-sort"></i> 添加排序
                    </button>
                    <button class="btn btn-outline-warning" onclick="addGroupOperation()">
                        <i class="fas fa-object-group"></i> 添加分组
                    </button>
                    <button class="btn btn-outline-info" onclick="addRenameOperation()">
                        <i class="fas fa-font"></i> 重命名列
                    </button>
                    <button class="btn btn-outline-secondary" onclick="addDropColumnsOperation()">
                        <i class="fas fa-trash"></i> 删除列
                    </button>
                    <button class="btn btn-outline-danger" onclick="clearOperations()">
                        <i class="fas fa-trash"></i> 清空操作
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-lg-9 col-md-8 mb-4">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-tasks"></i> 操作序列</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>操作类型</th>
                                <th>参数</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="operationList">
                            <tr>
                                <td colspan="4" class="text-center">暂无操作</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">输出文件名</label>
                    <input type="text" class="form-control" id="outputFilename" placeholder="请输入输出文件名（不含扩展名）">
                </div>
                
                <button id="processBtn" class="btn btn-success w-100" disabled>
                    <i class="fas fa-bolt"></i> 执行处理
                </button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-chart-bar"></i> 处理结果</h5>
            </div>
            <div class="card-body">
                <div id="processingResult">
                    <div class="text-center">
                        <i class="fas fa-info-circle fa-2x text-info mb-2"></i>
                        <p>配置处理操作并执行以查看结果</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 过滤操作模态框 -->
<div class="modal fade" id="filterModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-filter"></i> 添加过滤操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择列</label>
                    <select class="form-select filter-column">
                        <option value="">请选择列</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">条件</label>
                    <select class="form-select filter-condition">
                        <option value="equal">等于</option>
                        <option value="not_equal">不等于</option>
                        <option value="greater">大于</option>
                        <option value="less">小于</option>
                        <option value="contains">包含</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">值</label>
                    <input type="text" class="form-control filter-value" placeholder="请输入过滤值">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmFilterOperation()">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 排序操作模态框 -->
<div class="modal fade" id="sortModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-sort"></i> 添加排序操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择列</label>
                    <select class="form-select sort-column">
                        <option value="">请选择列</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">排序方式</label>
                    <select class="form-select sort-ascending">
                        <option value="true">升序</option>
                        <option value="false">降序</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmSortOperation()">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 分组操作模态框 -->
<div class="modal fade" id="groupModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-object-group"></i> 添加分组操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择列</label>
                    <select class="form-select group-column">
                        <option value="">请选择列</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">聚合函数</label>
                    <select class="form-select group-aggregation">
                        <option value="sum">求和</option>
                        <option value="mean">平均值</option>
                        <option value="count">计数</option>
                        <option value="min">最小值</option>
                        <option value="max">最大值</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmGroupOperation()">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 重命名列操作模态框 -->
<div class="modal fade" id="renameModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-font"></i> 重命名列</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择列</label>
                    <select class="form-select rename-column">
                        <option value="">请选择列</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">新列名</label>
                    <input type="text" class="form-control rename-new-name" placeholder="请输入新列名">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmRenameOperation()">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 删除列操作模态框 -->
<div class="modal fade" id="dropColumnsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-trash"></i> 删除列</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择要删除的列（可多选）</label>
                    <select multiple class="form-select drop-columns-select">
                        <option value="">请选择列</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmDropColumnsOperation()">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentData = null;
let currentFilename = null;
let operations = [];

document.addEventListener('DOMContentLoaded', function() {
    // 加载数据源列表
    loadDataSourceList();
    
    // 设置事件监听器
    document.getElementById('sourceDataSelect').addEventListener('change', function() {
        const filename = this.value;
        document.getElementById('loadSourceBtn').disabled = !filename;
    });
    
    document.getElementById('loadSourceBtn').addEventListener('click', function() {
        const filename = document.getElementById('sourceDataSelect').value;
        if (filename) {
            loadDataForProcessing(filename);
        }
    });
    
    document.getElementById('processBtn').addEventListener('click', function() {
        processData();
    });
});

// 加载数据源列表
function loadDataSourceList() {
    const selectElement = document.getElementById('sourceDataSelect');
    selectElement.innerHTML = '<option value="">加载中...</option>';
    
    axios.get('/api/data_sources')
        .then(function(response) {
            const sources = response.data;
            
            if (sources.length === 0) {
                selectElement.innerHTML = '<option value="">暂无数据源</option>';
                return;
            }
            
            let selectHtml = '<option value="">请选择数据源</option>';
            sources.forEach(function(source) {
                selectHtml += `<option value="${source.name}">${source.name}</option>`;
            });
            selectElement.innerHTML = selectHtml;
        })
        .catch(function(error) {
            console.error('Error loading data sources:', error);
            selectElement.innerHTML = '<option value="">加载失败</option>';
            showMessage('加载数据源失败: ' + error.message, 'danger');
        });
}

// 加载待处理数据
function loadDataForProcessing(filename) {
    const resultContainer = document.getElementById('processingResult');
    resultContainer.innerHTML = `
        <div class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2">数据加载中...</p>
        </div>
    `;
    
    axios.get(`/api/data/${filename}/preview`)
        .then(function(response) {
            const data = response.data;
            if (data.error) {
                resultContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <h5><i class="fas fa-exclamation-triangle"></i> 加载失败</h5>
                        <p>错误信息: ${data.error}</p>
                    </div>
                `;
                return;
            }
            
            currentData = data;
            currentFilename = filename;
            
            // 显示数据信息
            resultContainer.innerHTML = `
                <div class="row mb-3">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">总行数</h6>
                                <p class="card-text fs-4">${data.info.total_rows}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">列数</h6>
                                <p class="card-text fs-4">${data.info.total_columns}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">数值列</h6>
                                <p class="card-text fs-4">${data.info.numeric_columns ? data.info.numeric_columns.length : 0}</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                ${data.columns.map(function(column) {
                                    return `<th>${column}</th>`;
                                }).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${data.data.slice(0, 10).map(function(row) {
                                return `<tr>
                                    ${data.columns.map(function(column) {
                                        return `<td>${row[column] !== undefined ? row[column] : ''}</td>`;
                                    }).join('')}
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            // 启用处理按钮
            document.getElementById('processBtn').disabled = operations.length === 0;
        })
        .catch(function(error) {
            console.error('Preview error:', error);
            resultContainer.innerHTML = `
                <div class="alert alert-danger">
                    <h5><i class="fas fa-exclamation-triangle"></i> 数据加载失败</h5>
                    <p>错误信息: ${error.message}</p>
                </div>
            `;
        });
}

// 添加过滤操作
function addFilterOperation() {
    if (!currentData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('filterModal'));
    const columnSelect = document.querySelector('#filterModal .filter-column');
    
    // 填充列选项
    let optionsHtml = '<option value="">请选择列</option>';
    currentData.columns.forEach(function(column) {
        optionsHtml += `<option value="${column}">${column}</option>`;
    });
    columnSelect.innerHTML = optionsHtml;
    
    modal.show();
}

// 确认添加过滤操作
function confirmFilterOperation() {
    const column = document.querySelector('#filterModal .filter-column').value;
    const condition = document.querySelector('#filterModal .filter-condition').value;
    const value = document.querySelector('#filterModal .filter-value').value;
    
    if (!column) {
        showMessage('请选择列', 'warning');
        return;
    }
    
    operations.push({
        type: 'filter',
        column: column,
        condition: condition,
        value: value
    });
    
    updateOperationList();
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('filterModal'));
    modal.hide();
    
    // 启用处理按钮
    document.getElementById('processBtn').disabled = false;
    
    showMessage('已添加过滤操作', 'success');
}

// 添加排序操作
function addSortOperation() {
    if (!currentData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('sortModal'));
    const columnSelect = document.querySelector('#sortModal .sort-column');
    
    // 填充列选项
    let optionsHtml = '<option value="">请选择列</option>';
    currentData.columns.forEach(function(column) {
        optionsHtml += `<option value="${column}">${column}</option>`;
    });
    columnSelect.innerHTML = optionsHtml;
    
    modal.show();
}

// 确认添加排序操作
function confirmSortOperation() {
    const column = document.querySelector('#sortModal .sort-column').value;
    const ascending = document.querySelector('#sortModal .sort-ascending').value === 'true';
    
    if (!column) {
        showMessage('请选择列', 'warning');
        return;
    }
    
    operations.push({
        type: 'sort',
        column: column,
        ascending: ascending
    });
    
    updateOperationList();
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('sortModal'));
    modal.hide();
    
    // 启用处理按钮
    document.getElementById('processBtn').disabled = false;
    
    showMessage('已添加排序操作', 'success');
}

// 添加分组操作
function addGroupOperation() {
    if (!currentData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('groupModal'));
    const columnSelect = document.querySelector('#groupModal .group-column');
    
    // 填充列选项
    let optionsHtml = '<option value="">请选择列</option>';
    currentData.columns.forEach(function(column) {
        optionsHtml += `<option value="${column}">${column}</option>`;
    });
    columnSelect.innerHTML = optionsHtml;
    
    modal.show();
}

// 确认添加分组操作
function confirmGroupOperation() {
    const column = document.querySelector('#groupModal .group-column').value;
    const aggFunc = document.querySelector('#groupModal .group-aggregation').value;
    
    if (!column) {
        showMessage('请选择列', 'warning');
        return;
    }
    
    operations.push({
        type: 'group',
        column: column,
        agg_func: aggFunc
    });
    
    updateOperationList();
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('groupModal'));
    modal.hide();
    
    // 启用处理按钮
    document.getElementById('processBtn').disabled = false;
    
    showMessage('已添加分组操作', 'success');
}

// 添加重命名列操作
function addRenameOperation() {
    if (!currentData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('renameModal'));
    const columnSelect = document.querySelector('#renameModal .rename-column');
    
    // 填充列选项
    let optionsHtml = '<option value="">请选择列</option>';
    currentData.columns.forEach(function(column) {
        optionsHtml += `<option value="${column}">${column}</option>`;
    });
    columnSelect.innerHTML = optionsHtml;
    
    modal.show();
}

// 确认添加重命名列操作
function confirmRenameOperation() {
    const column = document.querySelector('#renameModal .rename-column').value;
    const newName = document.querySelector('#renameModal .rename-new-name').value;
    
    if (!column || !newName) {
        showMessage('请选择列并输入新列名', 'warning');
        return;
    }
    
    operations.push({
        type: 'rename',
        column: column,
        new_name: newName
    });
    
    updateOperationList();
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('renameModal'));
    modal.hide();
    
    // 启用处理按钮
    document.getElementById('processBtn').disabled = false;
    
    showMessage('已添加重命名列操作', 'success');
}

// 添加删除列操作
function addDropColumnsOperation() {
    if (!currentData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('dropColumnsModal'));
    const columnSelect = document.querySelector('#dropColumnsModal .drop-columns-select');
    
    // 填充列选项
    let optionsHtml = '';
    currentData.columns.forEach(function(column) {
        optionsHtml += `<option value="${column}">${column}</option>`;
    });
    columnSelect.innerHTML = optionsHtml;
    
    modal.show();
}

// 确认添加删除列操作
function confirmDropColumnsOperation() {
    const selectedOptions = document.querySelector('#dropColumnsModal .drop-columns-select').selectedOptions;
    const columns = Array.from(selectedOptions).map(option => option.value);
    
    if (columns.length === 0) {
        showMessage('请选择至少一列', 'warning');
        return;
    }
    
    operations.push({
        type: 'drop_columns',
        columns: columns
    });
    
    updateOperationList();
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('dropColumnsModal'));
    modal.hide();
    
    // 启用处理按钮
    document.getElementById('processBtn').disabled = false;
    
    showMessage('已添加删除列操作', 'success');
}

// 更新操作列表显示
function updateOperationList() {
    const listElement = document.getElementById('operationList');
    
    if (operations.length === 0) {
        listElement.innerHTML = '<tr><td colspan="4" class="text-center">暂无操作</td></tr>';
        return;
    }
    
    let listHtml = '';
    operations.forEach(function(op, index) {
        let opText = '';
        let paramText = '';
        switch(op.type) {
            case 'filter':
                opText = '过滤';
                paramText = `${op.column} ${getConditionText(op.condition)} ${op.value}`;
                break;
            case 'sort':
                opText = '排序';
                paramText = `${op.column} (${op.ascending ? '升序' : '降序'})`;
                break;
            case 'group':
                opText = '分组';
                paramText = `${op.column} (${op.agg_func})`;
                break;
            case 'rename':
                opText = '重命名';
                paramText = `${op.column} → ${op.new_name}`;
                break;
            case 'drop_columns':
                opText = '删除列';
                paramText = op.columns.join(', ');
                break;
        }
        
        listHtml += `
            <tr>
                <td>${index + 1}</td>
                <td>${opText}</td>
                <td>${paramText}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeOperation(${index})">
                        <i class="fas fa-trash"></i> 删除
                    </button>
                </td>
            </tr>
        `;
    });
    
    listElement.innerHTML = listHtml;
}

// 获取条件文本
function getConditionText(condition) {
    const conditions = {
        'equal': '=',
        'not_equal': '!=',
        'greater': '>',
        'less': '<',
        'contains': '包含'
    };
    return conditions[condition] || condition;
}

// 删除操作
function removeOperation(index) {
    operations.splice(index, 1);
    updateOperationList();
    
    // 如果没有操作了，禁用处理按钮
    document.getElementById('processBtn').disabled = operations.length === 0;
    
    showMessage('已删除操作', 'success');
}

// 清空操作
function clearOperations() {
    operations = [];
    updateOperationList();
    document.getElementById('processBtn').disabled = true;
    showMessage('已清空所有操作', 'info');
}

// 执行数据处理
function processData() {
    if (!currentFilename) {
        showMessage('请先选择数据源', 'warning');
        return;
    }
    
    if (operations.length === 0) {
        showMessage('请添加至少一个处理操作', 'warning');
        return;
    }
    
    const outputFilename = document.getElementById('outputFilename').value;
    if (!outputFilename) {
        showMessage('请输入输出文件名', 'warning');
        return;
    }
    
    const resultContainer = document.getElementById('processingResult');
    resultContainer.innerHTML = `
        <div class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">处理中...</span>
            </div>
            <p class="mt-2">数据处理中...</p>
        </div>
    `;
    
    axios.post('/api/process', {
        filename: currentFilename,
        operations: operations,
        output_filename: outputFilename
    })
    .then(function(response) {
        const data = response.data;
        if (data.error) {
            resultContainer.innerHTML = `
                <div class="alert alert-danger">
                    <h5><i class="fas fa-exclamation-triangle"></i> 处理失败</h5>
                    <p>错误信息: ${data.error}</p>
                </div>
            `;
            return;
        }
        
        // 显示处理结果信息
        resultContainer.innerHTML = `
            <div class="alert alert-success">
                <h5><i class="fas fa-check-circle"></i> 处理成功</h5>
                <div class="row">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">文件名</h6>
                                <p class="card-text">${data.filename}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">行数</h6>
                                <p class="card-text fs-4">${data.rows}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">列数</h6>
                                <p class="card-text fs-4">${data.columns}</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <a href="/visualization" class="btn btn-primary">
                        <i class="fas fa-chart-bar"></i> 可视化结果
                    </a>
                    <button class="btn btn-success" onclick="loadDataForProcessing('${data.filename}')">
                        <i class="fas fa-sync"></i> 加载处理结果
                    </button>
                </div>
            </div>
            
            <div class="table-responsive mt-4">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            ${Object.keys(data.data[0] || {}).map(function(key) {
                                return `<th>${key}</th>`;
                            }).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${data.data.slice(0, 10).map(function(row) {
                            return `<tr>
                                ${Object.values(row).map(function(value) {
                                    return `<td>${value !== null ? value : ''}</td>`;
                                }).join('')}
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        `;
        
        showMessage('数据处理完成', 'success');
        
        // 更新数据源列表
        loadDataSourceList();
    })
    .catch(function(error) {
        console.error('Process error:', error);
        resultContainer.innerHTML = `
            <div class="alert alert-danger">
                <h5><i class="fas fa-exclamation-triangle"></i> 处理失败</h5>
                <p>错误信息: ${error.message}</p>
            </div>
        `;
        showMessage('数据处理失败: ' + error.message, 'danger');
    });
}
</script>
{% endblock %}
