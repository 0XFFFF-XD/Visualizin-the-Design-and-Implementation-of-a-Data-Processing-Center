{% extends "base.html" %}

{% block title %}数据处理 - 数据处理与可视化中心{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h2 class="my-3">数据处理</h2>
        </div>
    </div>
    
    <div class="row">
        <!-- 控制面板 -->
        <div class="col-xl-3 col-lg-4 col-md-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">数据源选择</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">选择数据文件</label>
                        <select class="form-select" id="sourceDataSelect">
                            <option selected>请选择数据源</option>
                        </select>
                    </div>
                    <button id="loadSourceBtn" class="btn btn-primary w-100" disabled>
                        <i class="fas fa-download"></i> 加载数据
                    </button>
                </div>
            </div>
            
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">处理操作</h5>
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2 mb-3">
                        <button class="btn btn-outline-secondary" type="button" onclick="addFilterOperation()">
                            <i class="fas fa-filter"></i> 添加过滤操作
                        </button>
                        <button class="btn btn-outline-secondary" type="button" onclick="addSortOperation()">
                            <i class="fas fa-sort"></i> 添加排序操作
                        </button>
                        <button class="btn btn-outline-secondary" type="button" onclick="addGroupOperation()">
                            <i class="fas fa-object-group"></i> 添加分组操作
                        </button>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">操作序列:</label>
                        <ul id="operationList" class="list-group">
                            <li class="list-group-item text-muted text-center">暂无操作</li>
                        </ul>
                    </div>
                    
                    <button id="processBtn" class="btn btn-success w-100" disabled>
                        <i class="fas fa-cogs"></i> 执行处理
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 主要内容区域 -->
        <div class="col-xl-9 col-lg-8 col-md-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">数据预览</h5>
                </div>
                <div class="card-body">
                    <div id="dataInfo" class="mb-3"></div>
                    <div id="processingDataPreview" class="table-responsive">
                        <p class="text-muted text-center my-5">请先选择并加载数据源</p>
                    </div>
                </div>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">处理结果</h5>
                </div>
                <div class="card-body">
                    <div id="processingResult" class="text-center">
                        <p class="text-muted my-5">执行处理后将显示结果</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 过滤操作模态框 -->
<div class="modal fade" id="filterModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加过滤操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择列</label>
                    <select class="form-select filter-column"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label">过滤值</label>
                    <input type="text" class="form-control filter-value" placeholder="请输入过滤值">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmFilterOperation()">添加</button>
            </div>
        </div>
    </div>
</div>

<!-- 排序操作模态框 -->
<div class="modal fade" id="sortModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加排序操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择列</label>
                    <select class="form-select sort-column"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label">排序方式</label>
                    <select class="form-select sort-direction">
                        <option value="true">升序</option>
                        <option value="false">降序</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmSortOperation()">添加</button>
            </div>
        </div>
    </div>
</div>

<!-- 分组操作模态框 -->
<div class="modal fade" id="groupModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加分组操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择列</label>
                    <select class="form-select group-column"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label">聚合函数</label>
                    <select class="form-select group-aggregation">
                        <option value="sum">求和</option>
                        <option value="mean">平均值</option>
                        <option value="count">计数</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmGroupOperation()">添加</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script>
let currentData = null;
let currentFilename = null;
let operations = [];

document.addEventListener('DOMContentLoaded', function() {
    // 加载数据源列表
    loadDataSourceList();
    
    // 设置事件监听器
    document.getElementById('sourceDataSelect').addEventListener('change', function() {
        const filename = this.value;
        document.getElementById('loadSourceBtn').disabled = !filename;
    });
    
    document.getElementById('loadSourceBtn').addEventListener('click', function() {
        const filename = document.getElementById('sourceDataSelect').value;
        if (filename) {
            loadDataForProcessing(filename);
        }
    });
    
    document.getElementById('processBtn').addEventListener('click', function() {
        processData();
    });
});

// 加载数据源列表
function loadDataSourceList() {
    axios.get('/api/data_sources')
        .then(function(response) {
            const sources = response.data;
            const selectElement = document.getElementById('sourceDataSelect');
            
            if (!sources || sources.length === 0) {
                selectElement.innerHTML = '<option selected>暂无数据源</option>';
                return;
            }
            
            let selectHtml = '<option selected>请选择数据源</option>';
            sources.forEach(function(source) {
                selectHtml += `<option value="${source.name}">${source.name}</option>`;
            });
            selectElement.innerHTML = selectHtml;
        })
        .catch(function(error) {
            console.error('Error loading data sources:', error);
            showMessage('加载数据源失败: ' + error.message, 'danger');
        });
}

// 加载待处理数据
function loadDataForProcessing(filename) {
    const previewContainer = document.getElementById('processingDataPreview');
    const infoContainer = document.getElementById('dataInfo');
    previewContainer.innerHTML = '<p class="text-center my-5"><i class="fas fa-spinner fa-spin fa-2x"></i><br>数据加载中...</p>';
    infoContainer.innerHTML = '';
    
    axios.get(`/api/data/${filename}/preview`)
        .then(function(response) {
            const data = response.data;
            if (data.error) {
                previewContainer.innerHTML = `<div class="alert alert-danger">
                    <h5><i class="fas fa-exclamation-triangle"></i> 加载失败</h5>
                    <p class="mb-0">错误信息: ${data.error}</p>
                    <small class="text-muted">请检查文件格式是否正确，确保是有效的CSV文件</small>
                </div>`;
                return;
            }
            
            // 验证数据结构
            if (!data || !data.columns || !data.data) {
                previewContainer.innerHTML = `<div class="alert alert-danger">
                    <h5><i class="fas fa-exclamation-circle"></i> 数据格式错误</h5>
                    <p class="mb-0">返回的数据格式不正确，请检查文件内容</p>
                </div>`;
                return;
            }
            
            currentData = data;
            currentFilename = filename;
            
            // 显示数据信息
            const dataInfo = data.info || {};
            infoContainer.innerHTML = `
                <div class="row text-center">
                    <div class="col-md-4">
                        <div class="alert alert-info mb-2">
                            <h6 class="mb-0">${dataInfo.total_rows || 0}</h6>
                            <small>总行数</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="alert alert-success mb-2">
                            <h6 class="mb-0">${dataInfo.total_columns || 0}</h6>
                            <small>总列数</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="alert alert-warning mb-2">
                            <h6 class="mb-0">${(dataInfo.numeric_columns || []).length}</h6>
                            <small>数值列</small>
                        </div>
                    </div>
                </div>
            `;
            
            // 构建表格
            let tableHtml = '<table class="table table-striped table-hover table-sm"><thead class="table-dark"><tr>';
            
            // 表头
            data.columns.forEach(function(column) {
                tableHtml += `<th>${column}</th>`;
            });
            
            tableHtml += '</tr></thead><tbody>';
            
            // 表体
            data.data.forEach(function(row) {
                tableHtml += '<tr>';
                data.columns.forEach(function(column) {
                    const value = row[column];
                    tableHtml += `<td>${value !== undefined && value !== null ? value : '<span class="text-muted">空</span>'}</td>`;
                });
                tableHtml += '</tr>';
            });
            
            tableHtml += '</tbody></table>';
            
            // 如果数据超过10行，添加提示
            if (data.data.length > 10) {
                tableHtml += `<div class="mt-2 text-muted small">
                    <i class="fas fa-info-circle"></i> 共 ${data.data.length} 行数据，仅显示前10行
                </div>`;
            }
            
            previewContainer.innerHTML = tableHtml;
        })
        .catch(function(error) {
            console.error('Preview error:', error);
            previewContainer.innerHTML = `<div class="alert alert-danger">
                <h5><i class="fas fa-exclamation-triangle"></i> 数据加载失败</h5>
                <p class="mb-0">错误信息: ${error.message}</p>
                <small class="text-muted">请尝试刷新页面或重新上传文件</small>
            </div>`;
        });
}

// 添加过滤操作
function addFilterOperation() {
    if (!currentData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('filterModal'));
    const columnSelect = document.querySelector('#filterModal .filter-column');
    
    // 填充列选项
    let optionsHtml = '<option value="">请选择列</option>';
    if (currentData.columns && currentData.columns.length > 0) {
        currentData.columns.forEach(function(column) {
            optionsHtml += `<option value="${column}">${column}</option>`;
        });
    }
    columnSelect.innerHTML = optionsHtml;
    
    modal.show();
}

// 确认添加过滤操作
function confirmFilterOperation() {
    const column = document.querySelector('#filterModal .filter-column').value;
    const value = document.querySelector('#filterModal .filter-value').value;
    
    if (!column) {
        showMessage('请选择列', 'warning');
        return;
    }
    
    if (!value) {
        showMessage('请输入过滤值', 'warning');
        return;
    }
    
    operations.push({
        type: 'filter',
        column: column,
        value: value
    });
    
    updateOperationList();
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('filterModal'));
    modal.hide();
    
    // 清空输入
    document.querySelector('#filterModal .filter-value').value = '';
    
    // 启用处理按钮
    document.getElementById('processBtn').disabled = false;
    
    showMessage('已添加过滤操作', 'success');
}

// 添加排序操作
function addSortOperation() {
    if (!currentData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('sortModal'));
    const columnSelect = document.querySelector('#sortModal .sort-column');
    
    // 填充列选项
    let optionsHtml = '<option value="">请选择列</option>';
    if (currentData.columns && currentData.columns.length > 0) {
        currentData.columns.forEach(function(column) {
            optionsHtml += `<option value="${column}">${column}</option>`;
        });
    }
    columnSelect.innerHTML = optionsHtml;
    
    modal.show();
}

// 确认添加排序操作
function confirmSortOperation() {
    const column = document.querySelector('#sortModal .sort-column').value;
    const ascending = document.querySelector('#sortModal .sort-direction').value === 'true';
    
    if (!column) {
        showMessage('请选择列', 'warning');
        return;
    }
    
    operations.push({
        type: 'sort',
        column: column,
        ascending: ascending
    });
    
    updateOperationList();
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('sortModal'));
    modal.hide();
    
    // 启用处理按钮
    document.getElementById('processBtn').disabled = false;
    
    showMessage('已添加排序操作', 'success');
}

// 添加分组操作
function addGroupOperation() {
    if (!currentData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('groupModal'));
    const columnSelect = document.querySelector('#groupModal .group-column');
    
    // 填充列选项
    let optionsHtml = '<option value="">请选择列</option>';
    if (currentData.columns && currentData.columns.length > 0) {
        currentData.columns.forEach(function(column) {
            optionsHtml += `<option value="${column}">${column}</option>`;
        });
    }
    columnSelect.innerHTML = optionsHtml;
    
    modal.show();
}

// 确认添加分组操作
function confirmGroupOperation() {
    const column = document.querySelector('#groupModal .group-column').value;
    const aggFunc = document.querySelector('#groupModal .group-aggregation').value;
    
    if (!column) {
        showMessage('请选择列', 'warning');
        return;
    }
    
    operations.push({
        type: 'group',
        column: column,
        agg_func: aggFunc
    });
    
    updateOperationList();
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('groupModal'));
    modal.hide();
    
    // 启用处理按钮
    document.getElementById('processBtn').disabled = false;
    
    showMessage('已添加分组操作', 'success');
}

// 更新操作列表显示
function updateOperationList() {
    const listElement = document.getElementById('operationList');
    
    if (operations.length === 0) {
        listElement.innerHTML = '<li class="list-group-item text-muted text-center">暂无操作</li>';
        return;
    }
    
    let listHtml = '';
    operations.forEach(function(op, index) {
        let opText = '';
        let opIcon = '';
        switch(op.type) {
            case 'filter':
                opText = `过滤: ${op.column} = ${op.value}`;
                opIcon = 'fas fa-filter';
                break;
            case 'sort':
                opText = `排序: ${op.column} (${op.ascending ? '升序' : '降序'})`;
                opIcon = 'fas fa-sort';
                break;
            case 'group':
                opText = `分组: ${op.column} (${op.agg_func})`;
                opIcon = 'fas fa-object-group';
                break;
        }
        
        listHtml += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="${opIcon} me-2"></i>${opText}</span>
                <button class="btn btn-sm btn-danger" onclick="removeOperation(${index})">
                    <i class="fas fa-trash"></i>
                </button>
            </li>
        `;
    });
    
    listElement.innerHTML = listHtml;
}

// 删除操作
function removeOperation(index) {
    operations.splice(index, 1);
    updateOperationList();
    
    // 如果没有操作了，禁用处理按钮
    document.getElementById('processBtn').disabled = operations.length === 0;
    
    showMessage('已删除操作', 'success');
}

// 执行数据处理
function processData() {
    if (!currentFilename) {
        showMessage('请先选择数据源', 'warning');
        return;
    }
    
    if (operations.length === 0) {
        showMessage('请添加至少一个处理操作', 'warning');
        return;
    }
    
    const resultContainer = document.getElementById('processingResult');
    resultContainer.innerHTML = '<p class="text-center my-5"><i class="fas fa-spinner fa-spin fa-2x"></i><br>数据处理中...</p>';
    
    axios.post('/api/process', {
        filename: currentFilename,
        operations: operations
    })
    .then(function(response) {
        const data = response.data;
        if (data.error) {
            resultContainer.innerHTML = `<div class="alert alert-danger">
                <h5><i class="fas fa-exclamation-triangle"></i> 处理失败</h5>
                <p class="mb-0">错误信息: ${data.error}</p>
                <small class="text-muted">请检查操作参数是否正确</small>
            </div>`;
            return;
        }
        
        resultContainer.innerHTML = `
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="alert alert-success">
                        <h5><i class="fas fa-check-circle"></i> 处理成功!</h5>
                        <p class="mb-1"><strong>文件名:</strong> ${data.filename}</p>
                        <p class="mb-1"><strong>行数:</strong> ${data.rows}</p>
                        <p class="mb-1"><strong>列数:</strong> ${data.columns}</p>
                        <div class="mt-3 d-grid gap-2">
                            <a href="/visualization?file=${data.filename}" class="btn btn-primary">
                                <i class="fas fa-chart-bar"></i> 查看可视化
                            </a>
                            <a href="/dashboard" class="btn btn-success">
                                <i class="fas fa-tachometer-alt"></i> 添加到仪表盘
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        showMessage('数据处理完成', 'success');
    })
    .catch(function(error) {
        console.error('Processing error:', error);
        resultContainer.innerHTML = `<div class="alert alert-danger">
            <h5><i class="fas fa-exclamation-triangle"></i> 数据处理失败</h5>
            <p class="mb-0">错误信息: ${error.message}</p>
            <small class="text-muted">请检查操作参数或尝试重新处理</small>
        </div>`;
        showMessage('数据处理失败: ' + error.message, 'danger');
    });
}
</script>
{% endblock %}
