{% extends "base.html" %}

{% block title %}数据可视化 - 数据处理与可视化中心{% endblock %}

{% block head %}
<style>
    .chart-container {
        position: relative;
        height: 400px;
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        padding: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2><i class="fas fa-chart-line"></i> 数据可视化</h2>
        <p class="text-muted">集成丰富的可视化图表类型，支持用户通过筛选等交互方式，从不同维度与粒度对数据进行探索与分析</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-3 col-md-4 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-database"></i> 数据源选择</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">选择数据文件</label>
                    <select class="form-select" id="visualizationDataSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <button id="loadVisualizationBtn" class="btn btn-primary w-100" disabled>
                    <i class="fas fa-download"></i> 加载数据
                </button>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-sliders-h"></i> 图表配置</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">图表类型</label>
                    <select class="form-select" id="chartType">
                        <option value="bar">柱状图</option>
                        <option value="line">折线图</option>
                        <option value="pie">饼图</option>
                        <option value="doughnut">环形图</option>
                        <option value="scatter">散点图</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">X轴字段</label>
                    <select class="form-select" id="xAxisField">
                        <option value="">请选择字段</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Y轴字段</label>
                    <select class="form-select" id="yAxisField">
                        <option value="">请选择字段</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">图表标题</label>
                    <input type="text" class="form-control" id="chartTitle" placeholder="请输入图表标题">
                </div>
                
                <button id="generateChartBtn" class="btn btn-success w-100" disabled>
                    <i class="fas fa-bolt"></i> 生成图表
                </button>
                
                <button id="addToDashboardBtn" class="btn btn-warning w-100 mt-2" disabled>
                    <i class="fas fa-tachometer-alt"></i> 添加到仪表盘
                </button>
            </div>
        </div>
    </div>
    
    <div class="col-lg-9 col-md-8 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-chart-bar"></i> 图表展示</h5>
            </div>
            <div class="card-body">
                <div id="chartContainer" class="chart-container">
                    <div class="d-flex align-items-center justify-content-center h-100">
                        <div class="text-center">
                            <i class="fas fa-chart-bar fa-3x text-muted mb-3"></i>
                            <p class="text-muted">请选择数据源并配置图表参数</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let currentVisualizationData = null;
let currentVisualizationFilename = null;
let currentChart = null;

document.addEventListener('DOMContentLoaded', function() {
    // 加载数据源列表
    loadVisualizationDataSourceList();
    
    // 设置事件监听器
    document.getElementById('visualizationDataSelect').addEventListener('change', function() {
        const filename = this.value;
        document.getElementById('loadVisualizationBtn').disabled = !filename;
    });
    
    document.getElementById('loadVisualizationBtn').addEventListener('click', function() {
        const filename = document.getElementById('visualizationDataSelect').value;
        if (filename) {
            loadVisualizationData(filename);
        }
    });
    
    document.getElementById('chartType').addEventListener('change', updateFieldOptions);
    document.getElementById('generateChartBtn').addEventListener('click', generateChart);
    document.getElementById('addToDashboardBtn').addEventListener('click', addToDashboard);
});

// 加载数据源列表
function loadVisualizationDataSourceList() {
    const selectElement = document.getElementById('visualizationDataSelect');
    selectElement.innerHTML = '<option value="">加载中...</option>';
    
    axios.get('/api/data_sources')
        .then(function(response) {
            const sources = response.data;
            
            if (!sources || sources.length === 0) {
                selectElement.innerHTML = '<option value="">暂无数据源</option>';
                return;
            }
            
            let selectHtml = '<option value="">请选择数据源</option>';
            sources.forEach(function(source) {
                selectHtml += `<option value="${source.name}">${source.name}</option>`;
            });
            selectElement.innerHTML = selectHtml;
        })
        .catch(function(error) {
            console.error('Error loading data sources:', error);
            selectElement.innerHTML = '<option value="">加载失败</option>';
            showMessage('加载数据源失败: ' + error.message, 'danger');
        });
}

// 加载可视化数据
function loadVisualizationData(filename) {
    const chartContainer = document.getElementById('chartContainer');
    chartContainer.innerHTML = `
        <div class="d-flex align-items-center justify-content-center h-100">
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-2">数据加载中...</p>
            </div>
        </div>
    `;
    
    axios.get(`/api/visualization/${filename}`)
        .then(function(response) {
            const data = response.data;
            if (data.error) {
                chartContainer.innerHTML = `
                    <div class="d-flex align-items-center justify-content-center h-100">
                        <div class="alert alert-danger">
                            <h5><i class="fas fa-exclamation-triangle"></i> 加载失败</h5>
                            <p>错误信息: ${data.error}</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            currentVisualizationData = data;
            currentVisualizationFilename = filename;
            
            // 更新字段选项
            updateFieldOptions();
            
            // 显示提示信息
            chartContainer.innerHTML = `
                <div class="d-flex align-items-center justify-content-center h-100">
                    <div class="text-center">
                        <i class="fas fa-info-circle fa-3x text-info mb-3"></i>
                        <h5>数据加载成功</h5>
                        <p>已加载 ${data.info.total_rows} 行数据，${data.info.total_columns} 列数据</p>
                        <p>请选择图表参数并点击"生成图表"按钮</p>
                    </div>
                </div>
            `;
            
            // 启用生成按钮
            document.getElementById('generateChartBtn').disabled = false;
        })
        .catch(function(error) {
            console.error('Visualization data error:', error);
            chartContainer.innerHTML = `
                <div class="d-flex align-items-center justify-content-center h-100">
                    <div class="alert alert-danger">
                        <h5><i class="fas fa-exclamation-triangle"></i> 数据加载失败</h5>
                        <p>错误信息: ${error.message}</p>
                    </div>
                </div>
            `;
        });
}

// 更新字段选项
function updateFieldOptions() {
    if (!currentVisualizationData) return;
    
    const data = currentVisualizationData;
    const chartType = document.getElementById('chartType').value;
    
    // 更新X轴字段选项
    let xOptionsHtml = '<option value="">请选择字段</option>';
    data.columns.forEach(function(column) {
        xOptionsHtml += `<option value="${column}">${column}</option>`;
    });
    document.getElementById('xAxisField').innerHTML = xOptionsHtml;
    
    // 更新Y轴字段选项（根据图表类型调整）
    let yOptionsHtml = '<option value="">请选择字段</option>';
    if (chartType === 'scatter') {
        // 散点图需要两个数值字段
        const numericColumns = data.info && data.info.numeric_columns ? data.info.numeric_columns : [];
        if (numericColumns.length > 0) {
            numericColumns.forEach(function(column) {
                yOptionsHtml += `<option value="${column}">${column}</option>`;
            });
        } else {
            // 如果没有识别出数值型字段，则显示所有字段
            data.columns.forEach(function(column) {
                yOptionsHtml += `<option value="${column}">${column}</option>`;
            });
        }
    } else {
        // 其他图表类型
        const numericColumns = data.info && data.info.numeric_columns ? data.info.numeric_columns : [];
        if (numericColumns.length > 0) {
            numericColumns.forEach(function(column) {
                yOptionsHtml += `<option value="${column}">${column}</option>`;
            });
        } else {
            // 如果没有识别出数值型字段，则显示所有字段
            data.columns.forEach(function(column) {
                yOptionsHtml += `<option value="${column}">${column}</option>`;
            });
        }
    }
    document.getElementById('yAxisField').innerHTML = yOptionsHtml;
}

// 生成图表
function generateChart() {
    if (!currentVisualizationData) {
        showMessage('请先加载数据', 'warning');
        return;
    }
    
    const chartType = document.getElementById('chartType').value;
    const xAxisField = document.getElementById('xAxisField').value;
    const yAxisField = document.getElementById('yAxisField').value;
    const chartTitle = document.getElementById('chartTitle').value || `${yAxisField} by ${xAxisField}`;
    
    if (!xAxisField || !yAxisField) {
        showMessage('请选择X轴和Y轴字段', 'warning');
        return;
    }
    
    // 销毁之前的图表实例
    if (currentChart) {
        currentChart.destroy();
    }
    
    // 准备图表数据
    const labels = currentVisualizationData.data.map(function(item) { 
        return item[xAxisField]; 
    });
    
    const values = currentVisualizationData.data.map(function(item) { 
        const value = item[yAxisField];
        return isNaN(parseFloat(value)) ? 0 : parseFloat(value);
    });
    
    // 创建图表容器
    const chartContainer = document.getElementById('chartContainer');
    chartContainer.innerHTML = '<canvas id="visualizationChart"></canvas>';
    
    // 获取图表上下文
    const ctx = document.getElementById('visualizationChart').getContext('2d');
    
    // 根据图表类型创建图表
    const chartConfig = {
        type: chartType,
        data: {
            labels: labels,
            datasets: [{
                label: yAxisField,
                data: values,
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: chartTitle
                },
                legend: {
                    display: true
                }
            }
        }
    };
    
    // 根据图表类型设置特定配置
    switch(chartType) {
        case 'bar':
            chartConfig.data.datasets[0].backgroundColor = 'rgba(54, 162, 235, 0.2)';
            chartConfig.data.datasets[0].borderColor = 'rgba(54, 162, 235, 1)';
            chartConfig.options.scales = {
                y: {
                    beginAtZero: true
                }
            };
            break;
            
        case 'line':
            chartConfig.data.datasets[0].fill = false;
            chartConfig.data.datasets[0].borderColor = 'rgb(75, 192, 192)';
            chartConfig.data.datasets[0].tension = 0.1;
            chartConfig.options.scales = {
                y: {
                    beginAtZero: true
                }
            };
            break;
            
        case 'pie':
        case 'doughnut':
            chartConfig.data.datasets[0].backgroundColor = [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 205, 86, 0.2)',
                'rgba(75, 192, 192, 0.2)',
                'rgba(153, 102, 255, 0.2)',
                'rgba(255, 159, 64, 0.2)'
            ];
            chartConfig.data.datasets[0].borderColor = [
                'rgb(255, 99, 132)',
                'rgb(54, 162, 235)',
                'rgb(255, 205, 86)',
                'rgb(75, 192, 192)',
                'rgb(153, 102, 255)',
                'rgb(255, 159, 64)'
            ];
            chartConfig.data.datasets[0].borderWidth = 1;
            break;
            
        case 'scatter':
            chartConfig.data.datasets[0].backgroundColor = 'rgba(255, 99, 132, 0.2)';
            chartConfig.data.datasets[0].borderColor = 'rgba(255, 99, 132, 1)';
            chartConfig.data.datasets[0].showLine = false;
            chartConfig.data.datasets[0].pointRadius = 5;
            break;
    }
    
    // 创建图表实例
    currentChart = new Chart(ctx, chartConfig);
    
    // 启用添加到仪表盘按钮
    document.getElementById('addToDashboardBtn').disabled = false;
    
    showMessage('图表生成成功', 'success');
}

// 添加到仪表盘
function addToDashboard() {
    if (!currentChart) {
        showMessage('请先生成图表', 'warning');
        return;
    }
    
    // 在实际应用中，这里应该将图表配置保存到仪表盘
    showMessage('添加到仪表盘功能将在后续版本中实现', 'info');
}
</script>
{% endblock %}
